services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: audio_recording
      MYSQL_USER: audio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h127.0.0.1 --protocol=TCP -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 2s
      timeout: 5s
      retries: 60
  api:
    image: audio-recording:deploy
    restart: unless-stopped
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      MYSQL_DSN: audio:${MYSQL_PASSWORD:?required}@tcp(mysql:3306)/audio_recording
      UPLOAD_DIR: /app/uploads
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?required}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
    ports:
      - '0.0.0.0:8080:8080'
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 20s
volumes:
  mysql_data:
  uploads:
